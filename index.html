<!doctype html>
<!-- ⚠ Тема со старта СВЕТЛАЯ: первым экраном идёт витрина, а не вход. Пока
     здесь стоял `auth-dark`, страница успевала мигнуть чёрным до загрузки
     приложения — на телефоне это читалось как сбой запуска. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — обязателен, иначе env(safe-area-inset-*) всегда
         нули, и содержимое уезжает под чёлку и под полосу жеста. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Личный контур здоровья: риски по системам, заряд, недельные отметки" />

    <!-- ⛔ Приложение не должно попадать в поисковую выдачу. Репозиторий
         открытый по решению владельца, но «открытый» и «проиндексированный»
         — разные вещи: первое означает «кто знает адрес, тот видит», второе
         — «находится по фамилии». -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- ═══ УСТАНОВКА НА ЭКРАН «ДОМОЙ» (iOS) ═══
         ⚠ Safari игнорирует manifest.webmanifest почти целиком: имя, иконку и
         режим он берёт из этих трёх мета-тегов и из apple-touch-icon. Манифест
         оставлен для Android и для десктопных браузеров — там работает он.

         ⚠ `mobile-web-app-capable` — современное имя того же тега; Safari
         понимает старое `apple-…`, остальные браузеры ругаются на него в
         консоли. Стоят оба.

         ⚠ status-bar-style: `default`, а не `black-translucent`. Прозрачная
         строка состояния кладёт часы и батарею ПОВЕРХ страницы, и на светлом
         холсте они становятся белым по белому. Отступ под чёлку приложение
         уже держит само (env(safe-area-inset-top)), подкладывать под неё
         содержимое незачем.

         ⛔ apple-touch-icon — ТОЛЬКО непрозрачный PNG. Прозрачный iOS зальёт
         чёрным, и на домашнем экране окажется чёрный квадрат. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Успею" />
    <!-- ⛔ ВСЕ ФАЙЛЫ В ./icons/ — ГЕНЕРАТ. Собираются командой
         `python3 tools/build_brand.py` из геометрии знака и из мастера целей
         `forecast/targets.md` (число 87 в клетке — это ЦЕЛЬ, а не прогноз:
         Д-58, Д-59). Руками не править — правка переживёт ровно до следующего
         прогона.

         ⚠ apple-touch-icon сведён на холст `--bg` и сохранён БЕЗ АЛЬФЫ:
         прозрачный PNG iOS заливает чёрным. Отдельный файл от icon-180.png
         оставлен именно поэтому. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- ⚠ ФАВИКОН — СОСТОЯНИЕ «ТОЛЬКО БУКВА». В 16–32 px число и слово
         превращаются в грязь и читаются как дефект отрисовки, а не как
         деталь. Клетка целиком живёт в иконках установки и на витрине.
         .ico — запасной для браузеров без SVG-фавикона. -->
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" sizes="32x32" href="./icons/favicon.ico" />

    <title>Успею — Трекер здоровья</title>

    <!-- Карточка ссылки. Индексация закрыта выше, но при отправке адреса в
         мессенджер превью всё равно собирается — пусть собирается знаком. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Успею" />
    <meta property="og:description" content="Горизонт планирования — теперь и для жизни." />
    <meta property="og:image" content="./icons/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
