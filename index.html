<!doctype html>
<!-- ⚠ Тема со старта СВЕТЛАЯ: первым экраном идёт витрина, а не вход. Пока
     здесь стоял `auth-dark`, страница успевала мигнуть чёрным до загрузки
     приложения — на телефоне это читалось как сбой запуска. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — обязателен, иначе env(safe-area-inset-*) всегда
         нули, и содержимое уезжает под чёлку и под полосу жеста. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Личный контур здоровья: риски по системам, заряд, недельные отметки" />

    <!-- ⛔ Приложение не должно попадать в поисковую выдачу. Репозиторий
         открытый по решению владельца, но «открытый» и «проиндексированный»
         — разные вещи: первое означает «кто знает адрес, тот видит», второе
         — «находится по фамилии». -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- ═══ УСТАНОВКА НА ЭКРАН «ДОМОЙ» (iOS) ═══
         ⚠ Safari игнорирует manifest.webmanifest почти целиком: имя, иконку и
         режим он берёт из этих трёх мета-тегов и из apple-touch-icon. Манифест
         оставлен для Android и для десктопных браузеров — там работает он.

         ⚠ `mobile-web-app-capable` — современное имя того же тега; Safari
         понимает старое `apple-…`, остальные браузеры ругаются на него в
         консоли. Стоят оба.

         ⚠ status-bar-style: `default`, а не `black-translucent`. Прозрачная
         строка состояния кладёт часы и батарею ПОВЕРХ страницы, и на светлом
         холсте они становятся белым по белому. Отступ под чёлку приложение
         уже держит само (env(safe-area-inset-top)), подкладывать под неё
         содержимое незачем.

         ⛔ apple-touch-icon — ТОЛЬКО непрозрачный PNG. Прозрачный iOS зальёт
         чёрным, и на домашнем экране окажется чёрный квадрат. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Успею 87" />
    <!-- ⛔ ВСЕ ФАЙЛЫ В ./icons/ — ГЕНЕРАТ. Собираются командой
         `python3 tools/build_brand.py` из геометрии знака и из мастера целей
         `forecast/targets.md` (число 87 в клетке — это ЦЕЛЬ, а не прогноз:
         Д-58, Д-59). Руками не править — правка переживёт ровно до следующего
         прогона.

         ⚠ apple-touch-icon сведён на холст `--bg` и сохранён БЕЗ АЛЬФЫ:
         прозрачный PNG iOS заливает чёрным. Отдельный файл от icon-180.png
         оставлен именно поэтому. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- ⚠ ФАВИКОН — ОДНО ЧИСЛО 87 КРУПНО (Д-67, 15.10.2026, слово владельца:
         «в favicon убери „У“ и крупно напиши 87»). В 16–32 px буква и число
         рядом превращались в пятно, а одно число читается. До Д-67 здесь
         стояла одна буква (`icon.svg`, состояние `min`) — этот файл остался
         для знака внутри контура. Клетка целиком живёт в иконках установки
         и на витрине. .ico — запасной для браузеров без SVG-фавикона. -->
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="icon" sizes="32x32" href="./icons/favicon.ico" />

    <title>Успею 87 – Михаил Изюмов</title>

    <!-- Карточка ссылки. Индексация закрыта выше, но при отправке адреса в
         мессенджер превью всё равно собирается — пусть собирается знаком.

         ⚠⚠ АДРЕСА ТОЛЬКО ПОЛНЫЕ (Д-72, 16.10.2026; слово владельца: «сделай
         так, чтобы когда отправляю ссылку на сайт в телеграм, то открывалась
         большая картинка с лого»). Стоял относительный `./icons/og-image.png`:
         бот Телеграма такой адрес не разбирает и картинку не показывал вовсе.
         Размеры названы, чтобы мессенджер сразу знал, что картинка широкая, и
         ставил её большой под ссылкой, а не миниатюрой сбоку.
         ⚠ `?v=` — номер картинки. Телеграм запоминает превью по адресу; новая
         картинка под старым адресом показалась бы не сразу. Меняешь картинку
         (`tools/build_brand.py`, функция `og_image`) — поднимай номер.
         ⚠ Домен — из `public/CNAME`. Сменится домен — меняются и эти строки. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Успею 87" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://uspeyu.ru/" />
    <meta property="og:title" content="Успею 87 – Михаил Изюмов" />
    <!-- Д-73: числа подставляет сборка из public.json (`vite.config.js`,
         `ogFromPublic`) — руками сюда не вписываются. -->
    <meta property="og:description" content="Ранскеил теперь и для жизни. __OG_HORIZON__" />
    <meta property="og:image" content="https://uspeyu.ru/icons/og-image.png?v=2" />
    <meta property="og:image:secure_url" content="https://uspeyu.ru/icons/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Знак «Успею 87» — клетка с числом 87 и буквой У" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://uspeyu.ru/icons/og-image.png?v=2" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
